services:

  hamburgueseria-pedidos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hamburgueseria-pedidos
    image: hamburgueseria-pedidos:latest
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-db_pedidosx}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - NOTIFICACIONES_URL=http://notificaciones:1080
    depends_on:
      mysql:
        condition: service_healthy
      notificaciones:
        condition: service_started
    networks:
      - hamburgueseria-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  mysql:
    image: mysql:8.0
    container_name: mysql-pedidos
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-db_pedidosx}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - hamburgueseria-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "${ADMINER_PORT:-8090}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hamburgueseria-net
    restart: unless-stopped

  notificaciones:
    image: mockserver/mockserver:5.15.0
    container_name: notificaciones-mock
    ports:
      - "${NOTIFICACIONES_PORT:-8082}:1080"
    environment:
      - MOCKSERVER_WATCH_INITIALIZATION_JSON=true
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/mockserver-config.json
    volumes:
      - ./docker/mockserver:/config:ro
    networks:
      - hamburgueseria-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1080' 2>/dev/null && echo OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - hamburgueseria-net
    restart: unless-stopped
    depends_on:
      hamburgueseria-pedidos:
        condition: service_started

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pushgateway
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    networks:
      - hamburgueseria-net
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - hamburgueseria-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - hamburgueseria-net
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - hamburgueseria-net
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

networks:
  hamburgueseria-net:
    driver: bridge
    name: hamburgueseria-network

volumes:
  mysql-data:
    name: hamburgueseria-mysql-data
  prometheus-data:
    name: hamburgueseria-prometheus-data
  loki-data:
    name: hamburgueseria-loki-data
  grafana-data:
    name: hamburgueseria-grafana-data
