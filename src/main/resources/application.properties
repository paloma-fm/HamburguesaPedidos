# Puerto del Microservicio
server.port=${SERVER_PORT:8081}

# Configuración de Base de Datos (sobreescribible por variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_pedidosx}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL del microservicio de notificaciones (sobreescribible por variable de entorno)
notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8082}

# Spring Boot Actuator: expone endpoints de salud para Docker healthchecks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always