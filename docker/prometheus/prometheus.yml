global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: hamburgueseria-pedidos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["hamburgueseria-pedidos:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
